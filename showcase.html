<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Showcase</title>
<link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>

<header class="site-header"><div id="navHost"></div></header>
<div id="mobileNavHost"></div>

<div class="wrap">
  <div id="segHost"></div>
  <div class="semester-select-wrap">
    <select class="select-pill" id="semesterSelect" style="margin-right:8px;"></select>
  </div>

  <h1 id="pageTitle">Showcase</h1>
  <div class="grid" id="showcaseGrid"><p class="empty-state" id="loadingText"></p></div>
</div>

<script src="config.js?v=10"></script>
<script src="app.js?v=10"></script>
<script>
let allItems = [];

async function init() {
  document.body.setAttribute("data-course", getCourse());
  renderNav("showcase");
  renderCourseSegmented(document.getElementById("segHost"), () => { document.body.setAttribute("data-course", getCourse()); renderNav("showcase"); applyText(); load(); });
  await populateSemesterSelect(document.getElementById("semesterSelect"));
  document.getElementById("semesterSelect").addEventListener("change", (e) => { setSemester(e.target.value); load(); });
  applyText();
  await load();
}
function applyText() {
  document.getElementById("pageTitle").textContent = t("showcase");
  setText("loadingText", t("loading"));
}
async function load() {
  const isCurrent = latestWins("showcase-load");
  const course = getCourse();
  const semester = getSemester();
  const items = await fetchJSON({ action: "showcase", course, semester });
  if (!isCurrent()) return;
  allItems = items;
  render(allItems);
}
function render(items) {
  const grid = document.getElementById("showcaseGrid");
  if (!items.length) { grid.innerHTML = `<p class="empty-state">${t("noShowcase")}</p>`; return; }
  grid.innerHTML = items.map((s) => `<a class="showcase-card" href="project.html?id=${encodeURIComponent(s.ID)}">
      <canvas width="400" height="200" data-title="${escapeHtml(s.Title)}" data-names="${escapeHtml(s.Names)}" data-semester="${escapeHtml(s.Semester)}" data-color="${escapeHtml(s.CoverColorHex)}"></canvas>
      <div class="meta"><span>${escapeHtml(s.Semester || "")}</span><span>${escapeHtml(s.GroupNumber || "")}</span></div>
    </a>`).join("");
  grid.querySelectorAll("canvas").forEach((c) => generateCoverCanvas(c, { title: c.dataset.title, names: c.dataset.names, semester: c.dataset.semester, colorHex: c.dataset.color }));
}
init();
</script>
</body>
</html>
