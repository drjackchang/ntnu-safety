<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Safety Education Course</title>
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>

  <!-- 毛玻璃頂部導覽列 -->
  <header class="navbar">
    <div class="nav-container">
      <div class="brand" id="brandText">Safety Education</div>
      <nav class="nav-links">
        <a href="#materials" id="navMaterials">Materials</a>
        <a href="#grading" id="navGrading">Grading</a>
        <a href="#showcase" id="navShowcase">Showcase</a>
        <a href="#submit" class="nav-btn" id="navSubmit">Submit</a>
      </nav>
    </div>
  </header>

  <main class="container">
    
    <!-- 課程切換器 -->
    <div class="course-switcher">
      <button data-course="emi" class="active">Safety Education (EMI)</button>
      <button data-course="grad">安全教育專題研究</button>
    </div>

    <!-- 課程簡介 Hero Section -->
    <section class="hero">
      <h1 id="pageTitle">Safety Education</h1>
      <p class="subtitle" id="pageLead"></p>
      <div class="tags-container" id="sdgsList"></div>
    </section>

    <!-- 課程目標與評分 -->
    <section class="info-grid">
      <div class="info-card">
        <h2 id="objectivesHeading">Course Objectives</h2>
        <ul class="clean-list" id="objectivesList"></ul>
      </div>
      <div class="info-card">
        <h2 id="gradingHeading">Grading</h2>
        <div class="grading-wrapper" id="gradingPanel"></div>
      </div>
    </section>

    <!-- 每週教材 -->
    <section class="materials-section" id="materials">
      <div class="section-header">
        <h2 id="materialsHeading">Weekly Materials</h2>
        <p class="section-desc" id="aiPolicyText"></p>
      </div>
      <div class="grid-layout" id="materialsGrid"></div>
    </section>

    <!-- 歷年成果 -->
    <section class="showcase-section" id="showcase">
      <h2 id="showcaseHeading">Student Showcase</h2>
      <div class="grid-layout" id="showcaseGrid"></div>
    </section>

    <section class="groups-section" id="groupsSection" style="display:none;">
      <h2 id="groupsHeading">This semester's groups</h2>
      <div class="grid-layout" id="groupsGrid"></div>
    </section>

    <!-- 參考書目 -->
    <section class="references-section">
      <h2 id="referencesHeading">References</h2>
      <ul class="ref-list" id="referencesList"></ul>
      <p class="note-text" id="supportNote"></p>
    </section>

    <!-- 進度回報表單 (已串接你的 Formspree) -->
    <section class="submit-section" id="submit">
      <div class="form-card">
        <h2 id="submitHeading">Submit Progress</h2>
        <form action="https://formspree.io/f/xqpkyjrj" method="POST" class="modern-form">
          <input type="hidden" name="Course" id="courseHiddenInput" value="Safety Education (EMI)">
          
          <div class="form-group">
            <label for="whoInput" id="lblWho">Your name or group</label>
            <input type="text" name="Name_or_Group" id="whoInput" required />
          </div>
          
          <div class="form-group">
            <label for="msgInput" id="lblMsg">Progress update</label>
            <textarea name="Message" id="msgInput" rows="4" required></textarea>
          </div>
          
          <button type="submit" class="submit-btn" id="submitBtn">Send Update</button>
          <p class="form-note" id="submitNote"></p>
        </form>
      </div>
    </section>

  </main>

  <script src="script.js?v=4"></script>
</body>
</html>
