<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Submit</title>
<link rel="stylesheet" href="styles.css?v=3" />
</head>
<body>

<header class="site-header"><div id="navHost"></div></header>
<div id="mobileNavHost"></div>

<div class="wrap">
  <div id="segHost"></div>
  <div class="semester-select-wrap"><select class="select-pill" id="semesterSelect"></select></div>

  <h1 id="pageTitle">Submit</h1>
  <p class="lead" id="pageLead"></p>

  <form class="stack panel" style="padding:22px 24px;" id="submitForm">
    <label>
      <span id="lblWho">Group</span>
      <select name="who" id="whoSelect"></select>
    </label>
    <label>
      <span id="lblAssignment">Assignment / week</span>
      <input type="text" name="assignmentName" required />
    </label>
    <label>
      <span id="lblLink">Submission link</span>
      <input type="text" name="submissionLink" placeholder="https://" required />
      <div class="field-error" id="errLink"></div>
    </label>
    <label>
      <span id="lblNotes">Notes (optional)</span>
      <textarea name="notes" rows="2"></textarea>
    </label>
    <div class="field-error" id="errRequired"></div>
    <button class="btn" type="submit" id="btnSend">Submit</button>
    <div class="form-status" id="formStatus"></div>
  </form>
</div>

<script src="config.js?v=3"></script>
<script src="app.js?v=3"></script>
<script>
async function init() {
  document.body.setAttribute("data-course", getCourse());
  renderNav("submit");
  renderCourseSegmented(document.getElementById("segHost"), () => { document.body.setAttribute("data-course", getCourse()); renderNav("submit"); applyText(); loadWho(); });
  await populateSemesterSelect(document.getElementById("semesterSelect"));
  document.getElementById("semesterSelect").addEventListener("change", () => loadWho());
  applyText();
  await loadWho();
}

function applyText() {
  const isEmi = getCourse() === "emi";
  document.getElementById("pageTitle").textContent = t("submit");
  document.getElementById("pageLead").textContent = isEmi ? "Submit your group's assignment or project link." : "提交您的作業或專案連結。";
  document.getElementById("lblWho").textContent = isEmi ? t("selectGroup") : t("selectName");
  document.getElementById("lblAssignment").textContent = t("assignmentName");
  document.getElementById("lblLink").textContent = t("submissionLink");
  document.getElementById("lblNotes").textContent = t("notes");
  document.getElementById("btnSend").textContent = t("send");
}

// Populates the "who" dropdown from the roster (group numbers for EMI, names for grad).
// Falls back to a free-text option if no roster is loaded yet for this course+semester.
async function loadWho() {
  const course = getCourse();
  const semester = getSemester();
  const students = await fetchJSON({ action: "students", course, semester });
  const sel = document.getElementById("whoSelect");

  if (course === "emi") {
    const groups = [...new Set(students.map((s) => s.GroupNumber).filter(Boolean))].sort();
    sel.innerHTML = groups.length
      ? groups.map((g) => `<option value="${escapeHtml(g)}">${escapeHtml(g)}</option>`).join("")
      : `<option value="">${t("selectGroup")} — roster not set up yet</option>`;
  } else {
    const names = [...new Set(students.map((s) => s.Name).filter(Boolean))].sort();
    sel.innerHTML = names.length
      ? names.map((n) => `<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join("")
      : `<option value="">${t("selectName")} — roster not set up yet</option>`;
  }
}

document.getElementById("submitForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const form = e.target;
  const errRequired = document.getElementById("errRequired");
  const errLink = document.getElementById("errLink");
  const statusEl = document.getElementById("formStatus");
  errRequired.textContent = ""; errLink.textContent = ""; statusEl.textContent = ""; statusEl.className = "form-status";

  const who = form.who.value.trim();
  const assignmentName = form.assignmentName.value.trim();
  const submissionLink = form.submissionLink.value.trim();

  if (!who || !assignmentName || !submissionLink) { errRequired.textContent = t("requiredField"); return; }
  if (!isValidUrl(submissionLink)) { errLink.textContent = t("invalidUrl"); return; }

  document.getElementById("btnSend").textContent = t("sending");
  const course = getCourse();
  try {
    const res = await postAction({
      action: "submit",
      course, semester: getSemester(),
      groupNumber: course === "emi" ? who : "",
      names: course === "emi" ? "" : who,
      assignmentName, submissionLink,
      notes: form.notes.value.trim(),
    });
    if (res.ok) { statusEl.textContent = t("sentOk"); statusEl.classList.add("ok"); form.reset(); }
    else { statusEl.textContent = t("sentErr"); statusEl.classList.add("error"); }
  } catch (err) {
    statusEl.textContent = t("sentErr"); statusEl.classList.add("error");
  }
  document.getElementById("btnSend").textContent = t("send");
});

init();
</script>
</body>
</html>
