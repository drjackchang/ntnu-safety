<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Course Materials</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-header"><div id="navHost"></div></header>
<div id="mobileNavHost"></div>

<div class="wrap">
  <div id="segHost"></div>
  <div class="semester-select-wrap"><select class="select-pill" id="semesterSelect"></select></div>

  <h1 id="pageTitle">Materials</h1>
  <div class="grid" id="materialsGrid" style="grid-template-columns: 1fr;"><p class="empty-state" id="loadingText"></p></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
async function init() {
  document.body.setAttribute("data-course", getCourse());
  renderNav("materials");
  renderCourseSegmented(document.getElementById("segHost"), () => { document.body.setAttribute("data-course", getCourse()); renderNav("materials"); applyText(); load(); });
  await populateSemesterSelect(document.getElementById("semesterSelect"));
  document.getElementById("semesterSelect").addEventListener("change", (e) => { setSemester(e.target.value); load(); });
  applyText();
  await load();
}
function applyText() {
  document.getElementById("pageTitle").textContent = t("materials");
  document.getElementById("loadingText").textContent = t("loading");
}
async function load() {
  const course = getCourse();
  const semester = getSemester();
  const materials = await fetchJSON({ action: "materials", course, semester });
  const grid = document.getElementById("materialsGrid");
  if (!materials.length) { grid.innerHTML = `<p class="empty-state">${t("noMaterials")}</p>`; return; }

  const weekKey = course === "emi" ? "Week" : "週次";
  const dateKey = course === "emi" ? "Date" : "日期";
  const topicKey = course === "emi" ? "Topic" : "主題";
  const descKey = course === "emi" ? "Description" : "說明";
  const linkKey = course === "emi" ? "FileLink" : "檔案連結";

  grid.innerHTML = materials.map((m) => {
    const link = m[linkKey] ? `<div style="margin-top:8px;"><a class="btn secondary" href="${escapeHtml(m[linkKey])}" target="_blank" rel="noopener">↗</a></div>` : "";
    return `<div class="card">
      <p class="week-tag">${t("week")} ${escapeHtml(m[weekKey])}${m[dateKey] ? " · " + escapeHtml(m[dateKey]) : ""}</p>
      <p class="card-title">${escapeHtml(m[topicKey])}</p>
      <p class="card-desc">${escapeHtml(m[descKey])}</p>
      ${link}
    </div>`;
  }).join("");
}
init();
</script>
</body>
</html>
