<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project</title>
<link rel="stylesheet" href="styles.css?v=6" />
</head>
<body>

<header class="site-header"><div id="navHost"></div></header>
<div id="mobileNavHost"></div>

<div class="wrap">
  <p><a id="backLink" class="btn secondary" href="showcase.html">← Back</a></p>
  <div id="content"><p class="empty-state">Loading…</p></div>
  <div id="commentsHost"></div>
</div>

<script src="config.js?v=6"></script>
<script src="app.js?v=6"></script>
<script>
async function loadProject() {
  document.body.setAttribute("data-course", getCourse());
  renderNav("showcase");
  document.getElementById("backLink").textContent = t("backToShowcase");

  const id = new URLSearchParams(location.search).get("id");
  const content = document.getElementById("content");
  if (!id) { content.innerHTML = `<p class="empty-state">${t("notFound")}</p>`; return; }

  const results = await fetchJSON({ action: "showcase", id });
  if (!results.length) { content.innerHTML = `<p class="empty-state">${t("notFound")}</p>`; return; }
  const s = results[0];

  if (s.Course) setCourse(String(s.Course).toLowerCase());
  document.body.setAttribute("data-course", getCourse());
  renderNav("showcase");
  document.getElementById("backLink").textContent = t("backToShowcase");

  content.innerHTML = `
    <div class="panel" style="padding:0; overflow:hidden;">
      <canvas id="coverCanvas" width="800" height="380" style="width:100%;height:auto;display:block;"></canvas>
      <div style="padding:22px 24px;">
        <h1 style="margin-top:0;">${escapeHtml(s.Title)}</h1>
        <p class="lead">${[s.GroupNumber, s.Names, s.Semester].filter(Boolean).map(escapeHtml).join("  ·  ")}</p>
        <p>${escapeHtml(s.Description || "")}</p>
        ${s.ProjectLink ? `<p><a class="btn" href="${escapeHtml(s.ProjectLink)}" target="_blank" rel="noopener">${t("viewProject")} ↗</a></p>` : ""}
      </div>
    </div>
  `;
  generateCoverCanvas(document.getElementById("coverCanvas"), { title: s.Title, names: s.Names, semester: s.Semester, colorHex: s.CoverColorHex });

  renderCommentsBox(document.getElementById("commentsHost"), "project-" + s.ID);
}
loadProject();
</script>
</body>
</html>
